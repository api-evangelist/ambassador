components:
  schemas:
    TLSContextList:
      type: object
      description: List of TLSContext resources
      properties:
        apiVersion:
          type: string
          const: getambassador.io/v3alpha1
          example: example_value
        kind:
          type: string
          const: TLSContextList
          example: example_value
        metadata:
          type: object
          properties:
            continue:
              type: string
            resourceVersion:
              type: string
          example: example_value
        items:
          type: array
          items:
            $ref: '#/components/schemas/TLSContext'
          example: []
    ObjectMeta:
      type: object
      description: Standard Kubernetes object metadata
      properties:
        name:
          type: string
          description: Name of the resource, unique within a namespace
          example: Example Title
        namespace:
          type: string
          description: Kubernetes namespace the resource belongs to
          example: example_value
        labels:
          type: object
          description: Key-value pairs for organizing and selecting resources
          additionalProperties:
            type: string
          example: example_value
        annotations:
          type: object
          description: Key-value pairs for storing arbitrary non-identifying metadata
          additionalProperties:
            type: string
          example: example_value
        creationTimestamp:
          type: string
          format: date-time
          description: Timestamp when the resource was created
          example: '2026-01-15T10:30:00Z'
        generation:
          type: integer
          description: Sequence number representing a specific generation of the resource
          example: 10
        resourceVersion:
          type: string
          description: Opaque value for optimistic concurrency control
          example: example_value
        uid:
          type: string
          description: Unique identifier for the resource
          example: '500123'
      required:
      - name
      - namespace
    TLSContext:
      type: object
      description: An Ambassador TLSContext resource that configures TLS settings for inbound or outbound connections, including certificates, protocols, and cipher suites.
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
          const: getambassador.io/v3alpha1
          example: example_value
        kind:
          type: string
          const: TLSContext
          example: example_value
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          $ref: '#/components/schemas/TLSContextSpec'
    TLSContextSpec:
      type: object
      description: Specification for a TLSContext resource
      properties:
        hosts:
          type: array
          description: Hostnames this TLSContext applies to
          items:
            type: string
          example: []
        secret:
          type: string
          description: Name of the Kubernetes Secret containing TLS certificates
          example: example_value
        cert_chain_file:
          type: string
          description: Path to the certificate chain PEM file (alternative to secret)
          example: example_value
        private_key_file:
          type: string
          description: Path to the private key PEM file (alternative to secret)
          example: example_value
        ca_secret:
          type: string
          description: Name of the Kubernetes Secret containing CA certificates for client verification
          example: example_value
        cert_required:
          type: boolean
          description: Whether client TLS certificates are required (mTLS)
          default: false
          example: true
        min_tls_version:
          type: string
          description: Minimum TLS version to accept
          enum:
          - v1.0
          - v1.1
          - v1.2
          - v1.3
          default: v1.2
          example: v1.0
        max_tls_version:
          type: string
          description: Maximum TLS version to accept
          enum:
          - v1.0
          - v1.1
          - v1.2
          - v1.3
          default: v1.3
          example: v1.0
        cipher_suites:
          type: array
          description: Allowed TLS cipher suites
          items:
            type: string
          example: []
        ecdh_curves:
          type: array
          description: Allowed ECDH curves
          items:
            type: string
          example: []
        alpn_protocols:
          type: string
          description: ALPN protocols to advertise
          example: example_value
        redirect_cleartext_from:
          type: integer
          description: Port number from which to redirect cleartext traffic to TLS
          example: 10
        sni:
          type: string
          description: SNI hostname to present for outbound TLS connections
          example: example_value
        ambassador_id:
          type: array
          description: Ambassador IDs that should use this TLSContext
          items:
            type: string
          example: '500123'
  parameters:
    Namespace:
      name: namespace
      in: path
      required: true
      description: Kubernetes namespace
      schema:
        type: string
      example: default
    ResourceName:
      name: name
      in: path
      required: true
      description: Name of the resource
      schema:
        type: string
    LabelSelector:
      name: labelSelector
      in: query
      required: false
      description: Kubernetes label selector to filter resources
      schema:
        type: string
      example: app=my-service
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token authentication. Tokens are managed through the Ambassador Edge Stack management interface or Kubernetes service account tokens.
externalDocs:
  description: Ambassador Edge Stack Documentation
  url: https://www.getambassador.io/docs/edge-stack/latest/
