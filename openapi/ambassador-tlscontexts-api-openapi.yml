      description: Replaces an existing TLSContext resource with the provided specification.
      tags:
      - TLSContexts
      parameters:
      - $ref: '#/components/parameters/Namespace'
      - $ref: '#/components/parameters/ResourceName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TLSContext'
            examples:
              UpdatetlscontextRequestExample:
                summary: Default updateTLSContext request
                x-microcks-default: true
