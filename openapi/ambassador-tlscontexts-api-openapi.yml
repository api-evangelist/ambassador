openapi: 3.1.0
info:
  title: Ambassador Edge Stack Diagnostics TLSContexts API
  description: API for managing Ambassador Edge Stack resources in Kubernetes environments. Ambassador Edge Stack is a Kubernetes-native API gateway built on Envoy Proxy that provides routing, load balancing, authentication, rate limiting, and observability for microservices. This specification covers the management of core custom resource definitions (CRDs) including Mapping, Host, TLSContext, RateLimitService, and related configuration resources exposed through the Edge Stack management API.
  version: 3.x
  contact:
    name: Ambassador Labs
    url: https://www.getambassador.io
    email: support@datawire.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://{ambassador-host}:8877
  description: Ambassador Edge Stack Admin API
  variables:
    ambassador-host:
      default: localhost
      description: Hostname or IP of the Ambassador Edge Stack admin interface
- url: https://{ambassador-host}/edge_stack/api
  description: Ambassador Edge Stack Management API
  variables:
    ambassador-host:
      default: localhost
      description: Hostname or IP of the Ambassador Edge Stack service
security:
- bearerAuth: []
tags:
- name: TLSContexts
  description: Manage TLSContext resources that configure TLS settings for Ambassador, including certificates, protocols, and cipher suites.
  externalDocs:
    url: https://www.getambassador.io/docs/edge-stack/latest/topics/running/tls/
paths:
  /apis/getambassador.io/v3alpha1/namespaces/{namespace}/tlscontexts:
    get:
      operationId: listTLSContexts
      summary: Ambassador List All Tls Contexts in a Namespace
      description: Returns a list of all TLSContext resources in the specified namespace. TLSContexts configure TLS settings such as certificates, protocols, and cipher suites.
      tags:
      - TLSContexts
      parameters:
      - $ref: '#/components/parameters/Namespace'
      - $ref: '#/components/parameters/LabelSelector'
      responses:
        '200':
          description: TLSContext list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TLSContextList'
              examples:
                Listtlscontexts200Example:
                  summary: Default listTLSContexts 200 response
                  x-microcks-default: true
                  value:
                    apiVersion: example_value
                    kind: example_value
                    metadata:
                      continue: example_value
                      resourceVersion: example_value
                    items:
                    - apiVersion: example_value
                      kind: example_value
        '401':
          description: Authentication required
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    post:
      operationId: createTLSContext
      summary: Ambassador Create a New Tls Context
      description: Creates a new TLSContext resource specifying TLS certificates, protocol versions, and cipher suite configuration.
      tags:
      - TLSContexts
      parameters:
      - $ref: '#/components/parameters/Namespace'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TLSContext'
            examples:
              CreatetlscontextRequestExample:
                summary: Default createTLSContext request
                x-microcks-default: true
                value:
                  apiVersion: example_value
                  kind: example_value
                  metadata:
                    name: Example Title
                    namespace: example_value
                    labels: example_value
                    annotations: example_value
                    creationTimestamp: '2026-01-15T10:30:00Z'
                    generation: 10
                    resourceVersion: example_value
                    uid: '500123'
                  spec:
                    hosts:
                    - {}
                    secret: example_value
                    cert_chain_file: example_value
                    private_key_file: example_value
                    ca_secret: example_value
                    cert_required: true
                    min_tls_version: v1.0
                    max_tls_version: v1.0
                    cipher_suites:
                    - {}
                    ecdh_curves:
                    - {}
                    alpn_protocols: example_value
                    redirect_cleartext_from: 10
                    sni: example_value
                    ambassador_id:
                    - {}
      responses:
        '201':
          description: TLSContext created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TLSContext'
              examples:
                Createtlscontext201Example:
                  summary: Default createTLSContext 201 response
                  x-microcks-default: true
                  value:
                    apiVersion: example_value
                    kind: example_value
                    metadata:
                      name: Example Title
                      namespace: example_value
                      labels: example_value
                      annotations: example_value
                      creationTimestamp: '2026-01-15T10:30:00Z'
                      generation: 10
                      resourceVersion: example_value
                      uid: '500123'
                    spec:
                      hosts:
                      - {}
                      secret: example_value
                      cert_chain_file: example_value
                      private_key_file: example_value
                      ca_secret: example_value
                      cert_required: true
                      min_tls_version: v1.0
                      max_tls_version: v1.0
                      cipher_suites:
                      - {}
                      ecdh_curves:
                      - {}
                      alpn_protocols: example_value
                      redirect_cleartext_from: 10
                      sni: example_value
                      ambassador_id:
                      - {}
        '400':
          description: Invalid TLSContext specification
        '401':
          description: Authentication required
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
